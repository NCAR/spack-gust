packages:
  openssl:
    externals:
    - spec: openssl@3.1.4
      prefix: /usr
    buildable: false
    require:
    - certs=system
  lustre:
    externals:
    - spec: lustre@2.15.5.2_cray_1_g9231caa
      prefix: /usr
    buildable: false
  pkg-config:
    externals:
    - spec: pkg-config@0.29.2
      prefix: /usr
    buildable: false
  gcc:
    externals:
    - spec: gcc@7.5.0 languages:='c,c++'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
    - spec: gcc@12.3.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-12
          cxx: /usr/bin/g++-12
          fortran: /usr/bin/gfortran-12
    - spec: gcc@13.3.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-13
          cxx: /usr/bin/g++-13
          fortran: /usr/bin/gfortran-13
    - spec: gcc@14.2.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-14
          cxx: /usr/bin/g++-14
          fortran: /usr/bin/gfortran-14
    prefer:
    - spec: '%gcc@7.5.0'
      when: '@:12'
    - spec: '%gcc@12.5.0'
      when: '@13:'
    variants:
    - +piclibs
    - languages=c,c++,fortran,go
  cce:
    externals:
    - spec: cce@17.0.1
      prefix: /opt/cray/pe/cce/17.0.1
      extra_attributes:
        compilers:
          c: /opt/cray/pe/cce/17.0.1/bin/craycc
          cxx: /opt/cray/pe/cce/17.0.1/bin/crayCC
          fortran: /opt/cray/pe/cce/17.0.1/bin/crayftn
        environment:
          set:
            CRAYPE_LINK_TYPE: dynamic
    - spec: cce@19.0.0
      prefix: /opt/cray/pe/cce/19.0.0
      extra_attributes:
        compilers:
          c: /opt/cray/pe/cce/19.0.0/bin/craycc
          cxx: /opt/cray/pe/cce/19.0.0/bin/crayCC
          fortran: /opt/cray/pe/cce/19.0.0/bin/crayftn
        environment:
          set:
            CRAYPE_LINK_TYPE: dynamic
    buildable: false
  c:
    buildable: true
  cxx:
    buildable: true
  fortran:
    buildable: true
  nvhpc:
    require:
    - +blas
    - +lapack
    - ~mpi
    prefer:
    - '%gcc@12.5.0'
  intel-oneapi-compilers:
    variants:
    - +nvidia
    prefer:
    - '%gcc@12.5.0'
  pkgconfig:
    buildable: false
    prefer:
    - pkg-config
  libfabric:
    externals:
    - spec: libfabric@1.22.0 fabrics=cxi,shm,tcp,udp
      prefix: /opt/cray/libfabric/1.22.0
    variants:
    - +cuda
    - +uring
    - fabrics=sockets,tcp,udp,cxi,rxm,rxd,mrail,shm,lnx
    prefer:
    - spec: '%gcc@12.5.0'
      when: '@2:'
    - spec: '%gcc@7.5.0'
      when: '@1'
  adios2:
    variants:
    - +cuda
    - +hdf5
    - +python
  all:
    permissions:
      read: world
      write: user
    target:
    # This target is lowest-common denominator between Intel and Milans
    - x86_64_v3
    prefer:
    - +pic
    - spec: ^hdf5 %gcc@12.5.0
      when: '%gcc@12.5.0 ^hdf5'
    - spec: ^udunits %gcc@12.5.0
      when: '%gcc@12.5.0 ^udunits'
    - spec: ^openblas %gcc@12.5.0
      when: '%gcc@12.5.0 ^openblas'
    - spec: ^openblas %gcc@15.1.0
      when: '%gcc@15.1.0 ^openblas'
    require:
    - spec: cuda_arch=80
      when: ^cuda
  tbb:
    prefer:
    - intel-oneapi-tbb
  aocc:
    require:
    - +license-agreed
  arpack-ng:
    variants:
    - ~mpi
  cairo:
    variants:
    - +X
    - +fc
    - +ft
    - +gobject
    - +pdf
    - +png
    - +svg
    - +zlib
    prefer:
    - '%gcc@12.5.0'
  cdo:
    variants:
    - +curl
    prefer:
    - '%gcc@12.5.0'
    - ^udunits %gcc@12.5.0
  cmake:
    variants:
    - +ownlibs
    prefer:
    - '%gcc@12.5.0'
  cmor:
    prefer:
    - '%gcc@12.5.0'
    - ^udunits %gcc@12.5.0
  cp2k:
    variants:
    - +elpa
    - +libvori
    - +plumed
    - +spglib
  cray-libsci:
    externals:
    - spec: cray-libsci@24.03.0 %cce
      prefix: /opt/cray/pe/libsci/24.03.0/CRAY/17.0/x86_64
    - spec: cray-libsci@24.03.0 %gcc
      prefix: /opt/cray/pe/libsci/24.03.0/GNU/12.3/x86_64
    - spec: cray-libsci@24.03.0 %nvhpc
      prefix: /opt/cray/pe/libsci/24.03.0/NVIDIA/23.3/x86_64
    - spec: cray-libsci@24.03.0 %intel-oneapi-compilers
      prefix: /opt/cray/pe/libsci/24.03.0/INTEL/2023.2/x86_64
    - spec: cray-libsci@25.03.0 %cce
      prefix: /opt/cray/pe/libsci/25.03.0/CRAY/17.0/x86_64
    - spec: cray-libsci@25.03.0 %gcc
      prefix: /opt/cray/pe/libsci/25.03.0/GNU/12.3/x86_64
    - spec: cray-libsci@25.03.0 %nvhpc
      prefix: /opt/cray/pe/libsci/25.03.0/NVIDIA/23.3/x86_64
    - spec: cray-libsci@25.03.0 %intel-oneapi-compilers
      prefix: /opt/cray/pe/libsci/25.03.0/INTEL/2025.0/x86_64
    buildable: false
  cray-mpich:
    externals:
    - spec: cray-mpich@8.1.29 %gcc
      prefix: /opt/cray/pe/mpich/8.1.29/ofi/gnu/12.3
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@8.1.29 %cce
      prefix: /opt/cray/pe/mpich/8.1.29/ofi/cray/17.0
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@8.1.29 %nvhpc
      prefix: /opt/cray/pe/mpich/8.1.29/ofi/nvidia/23.3
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@8.1.29 %intel-oneapi-compilers
      prefix: /opt/cray/pe/mpich/8.1.29/ofi/intel/2022.1
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@8.1.32 %gcc
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/gnu/12.3
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@8.1.32 %cce
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/cray/17.0
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@8.1.32 %nvhpc
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/nvidia/23.3
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@8.1.32 %intel-oneapi-compilers
      prefix: /opt/cray/pe/mpich/8.1.32/ofi/intel/2022.1
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@9.0.0 %gcc
      prefix: /opt/cray/pe/mpich/9.0.0/ofi/gnu/12.3
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@9.0.0 %cce
      prefix: /opt/cray/pe/mpich/9.0.0/ofi/cray/17.0
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@9.0.0 %nvhpc
      prefix: /opt/cray/pe/mpich/9.0.0/ofi/nvidia/23.3
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    - spec: cray-mpich@9.0.0 %intel-oneapi-compilers
      prefix: /opt/cray/pe/mpich/9.0.0/ofi/intel/2022.1
      extra_attributes:
        environment:
          append_path:
            LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
    prefer:
    - +cuda
    - cuda_arch=80
    buildable: false
  cuda:
    require:
    - +allow-unsupported-compilers
    variants:
    - +dev
  curl:
    variants:
    - +libidn2
    - +libssh
    - +libssh2
    - +nghttp2
    prefer:
    - tls=openssl
    - '%gcc@12.5.0'
  darshan-runtime:
    variants:
    - +parallel-netcdf
    - scheduler=pbs
    require:
    - spec: ^hdf5+mpi
      when: +hdf5
    prefer:
    - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
      when: '%gcc@15'
  darshan-util:
    variants:
    - +bzip2
    prefer:
    - '%gcc@12.5.0'
  doxygen:
    variants:
    - +graphviz
  eccodes:
    variants:
    - +fortran
    - +png
    - +tools
    - jp2k=jasper
    require:
    - +netcdf
  esmf:
    variants:
    - ~mpi
    - ~xerces
    require:
    - +external-lapack
    - +external-parallelio
    - +netcdf
    - one_of:
      - +pnetcdf +mpi
      - ~pnetcdf ~mpi
  ffmpeg:
    variants:
    - +X
    - +drawtext
    - +libaom
    - +libmp3lame
    - +libopenjpeg
    - +libopus
    - +libsnappy
    - +libspeex
    - +libssh
    - +libvorbis
    - +libvpx
    - +libwebp
    - +libx264
    - +libxml2
    - +libzma
    - +libzmq
    - +sdl2
  fftw:
    variants:
    - ~mpi
  gdal:
    require:
    - spec: ^hdf5~mpi
      when: +hdf5
    variants:
    - +blosc
    - +curl
    - +deflate
    - +expat
    - +geos
    - +gif
    - +grib
    - ~hdf4
    - +hdf5
    - +iconv
    - +jpeg
    - +libaec
    - +libcsf
    - +liblzma
    - +libxml2
    - +lz4
    - +netcdf
    - +openjpeg
    - +parquet
    - +pcidsk
    - +pdfium
    - +png
    - +qhull
    - +sqlite3
    - +webp
    - +zstd
  gdb:
    variants:
    - +gold
    - +ld
    - +lto
    - +source-highlight
    - +tui
    - ~debuginfod
    - ~python
    prefer:
    - '%gcc@12.5.0'
  git:
    variants:
    - +svn
    - +tcltk
    prefer:
    - '%gcc@12.5.0'
  glx:
    require:
    - mesa
  gmake:
    variants:
    - ~guile
    require:
    # This may help ioapi build
    - '@:4.2'
    prefer:
    - '%gcc@12.5.0'
  gmt:
    variants:
    - +ffmpeg
    - +fftw
    - +geos
    - +ghostscript
    - +glib
    - +pcre
    require:
    - +blas
    - +lapack
    - spec: '^ffmpeg@7:'
      when: +ffmpeg
    prefer:
    - '%gcc@12.5.0'
  gnuplot:
    variants:
    - +X
    - +wx
    prefer:
    - +qt
    - '%gcc@12.5.0'
  gptl:
    variants:
    - +nestedomp
    - +papi
    - +pmpi
    prefer:
    - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
      when: '%gcc@15'
  grads:
    require:
    - +dap
    - +hdf4
  h5z-ftp:
    require:
    - ^hdf5~mpi
  harfbuzz:
    variants:
    - +graphite2
    prefer:
    - '%gcc@12.5.0'
  hdf:
    variants:
    - +fortran
    - +szip
    require:
    - +external-xdr
    prefer:
    - spec: cflags='-std=c90 -Wno-error=int-conversion'
      when: '%gcc@15'
    - spec: cflags='-std=c90 -Wno-error=int-conversion'
      when: '%cce'
    - spec: cflags='-std=c90 -Wno-error=int-conversion'
      when: '%intel-oneapi-compilers'
  hdf5:
    variants:
    - +cxx
    - +fortran
    - +hl
    - +map
    - +szip
    - ~mpi
  hwloc:
    variants:
    - +cuda
    - +nvml
  imagemagick:
    variants:
    - +ghostscript
  intel-oneapi-mkl:
    require:
    - spec: +gfortran threads=openmp
      when: '%gcc'
  intel-oneapi-mpi:
    variants:
    - +external-libfabric
    - +generic-names
  ispc:
    require:
    - '%clang'
  jasper:
    prefer:
    - '@:2'
    - '%gcc@12.5.0'
  kokkos:
    variants:
    - +examples
    - ~openmp
    require:
    - spec: +cuda +wrapper ~alloc_async
      when: '%gcc'
    - spec: +cuda +wrapper ~alloc_async
      when: '%nvhpc'
    - spec: ^cmake@3.27
      when: '@:4.2.01 +cuda'
  libarchive:
    require:
    - compression=bz2lib,lz4,lzma,lzo2,zlib,zstd xar=expat
  libcxi:
    variants:
    - +cuda
  libgeotiff:
    require:
    # Doesn't build without proj as a dependency for me
    - +proj
    prefer:
    - '%gcc@12.5.0'
  libllvm:
    conflict:
    - llvm-amdgpu
  libunwind:
    variants:
    - +cxx_exceptions
    - +debug_frame
    - +xz
    - +zlib
    - components=setjmp,ptrace,coredump
  linaro-forge:
    require:
    - +accept-eula
  mesa:
    require:
    - +llvm
    - '@25:'
    prefer:
    - ^llvm ~clang
  met:
    variants:
    - +graphics
    - +grib2
    - +lidar2nc
    - +modis
    - +python
  metplus:
    variants:
    - +cycloneplotter
    - +makeplots
    - +plotdataplane
    - +series_analysis
  mpi:
    prefer:
    - cray-mpich
  mpich:
    variants:
    - +cuda
    require:
    - device=ch4
    - netmod=ofi
    - pmi=pmi2
    - +vci
    - +xpmem
  mpifileutils:
    variants:
    - +gpfs
    - +lustre
    - +xattr
  musica:
    variants:
    - ~tuvx
  mvapich:
    variants:
    - file_systems=lustre,gpfs,nfs,ufs
    - process_managers=auto
    require:
    - netmod=ofi
    - spec: ~cuda
      when: '%intel-oneapi-compilers'
    - spec: +cuda
      when: '%nvhpc'
  ncl:
    variants:
    - +eemd
    - +gdal
    - +grib
    - +hdf-eos2
    - +hdf-eos5
    - +hdf4
  netcdf:
    variants:
    - +dap
    - ~mpi
  netcdf-c:
    variants:
    - +dap
    - +nczarr_zip
    - ~mpi
    prefer:
    # Would do require, but ncvis barfs
    - build_system=cmake
  octave:
    variants:
    - +arpack
    - +curl
    - +fftw
    - +fltk
    - +fontconfig
    - +freetype
    - +gl2ps
    - +glpk
    - +gnuplot
    - +hdf5
    - +llvm
    - +magick
    - +opengl
    - +qhull
    - +qrupdate
    - +qscintilla
    - +qt
    - +suitesparse
    - +zlib
  openblas:
    variants:
    - +fortran
    - threads=openmp
  openmpi:
    require:
    - fabrics=cma,ofi
    - schedulers=tm
    - +gpfs
    - +lustre
    - +internal-pmix
    - +cuda
    - +romio
    - romio-filesystem=nfs,gpfs,lustre,ufs
    - spec: ^libfabric fabrics=cxi,lnx,mrail,rxd,rxm,shm,sockets,tcp,udp
  openpbs:
    externals:
    - spec: openpbs@2021.1.3
      prefix: /opt/pbs
    buildable: false
  osu-micro-benchmarks:
    variants:
    - +cuda
    prefer:
    - spec: ~cuda
      when: '%gcc@15'
  pango:
    variants:
    - +X
    prefer:
    - '%gcc@12.5.0'
  parallel-netcdf:
    variants:
    - +examples
    prefer:
    - spec: cflags='-std=c17 -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
      when: '%gcc@15'
  parallelio:
    variants:
    - +ncint
    - +pnetcdf
    - ~logging
    require:
    - +fortran
    - spec: ~pnetcdf
      when: ~mpi
  parallelio1:
    variants:
    - +pnetcdf
  py-netcdf4:
    variants:
    - ~mpi
  py-numpy:
    require:
    - '%blas=openblas'
  python:
    prefer:
    - spec: '@3.11'
    - '%gcc@12.5.0'
    - +ssl
  qt:
    variants:
    - +dbus
    - +examples
    - +opengl
    - +webkit
    require:
    - +gtk
    - +ssl
    - '@5.14.2'
    prefer:
    - '%gcc@12.5.0'
  singularityce:
    variants:
    - ~suid
  snappy:
    require:
    # Required for arrow, which is needed for parquet support in GDAL
    - ~shared
  superlu-dist:
    variants:
    - +openmp
    prefer:
    - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
      when: '%gcc@15'
    - spec: ^openblas %gcc@15.1.0
      when: '%gcc@15.1.0 ^openblas'
  vim:
    variants:
    - +cscope
    - +lua
    - +perl
    - +python
    - +ruby
    - +x
    - features=huge
    prefer:
    - '%gcc@12.5.0'
    require:
    - +gui
    - +gtk
  pandoc:
    require:
    - +texlive
  wgrib2:
    variants:
    - +ipolates
    - +netcdf
    - +proj4
    - +udf
    - ~netcdf3
    prefer:
    - '%gcc@12.5.0'
  wxwidgets:
    variants:
    - +opengl
  zfp:
    variants:
    - +tight-error
    - round=first
  zlib-api:
    prefer:
    - zlib-ng
  zlib-ng:
    require:
    - +compat
    - +new_strategies
    - +shared
    prefer:
    - '%gcc@12.5.0'
  zstd:
    variants:
    - +programs
    prefer:
    - '%gcc@12.5.0'
    - compression=lz4,lzma,zlib
  xnedit:
    require:
    # Wont build without this, actually!
    - +motif
    prefer:
    - '%gcc@12.5.0'
  matlab:
    externals:
    - spec: matlab@R2024a
      prefix: /glade/u/apps/opt/matlab/R2024a
    buildable: false
  diffutils:
    prefer:
    - '%gcc@12.5.0'
  gawk:
    prefer:
    - '%gcc@12.5.0'
  libsigsegv:
    prefer:
    - '%gcc@12.5.0'
  readline:
    prefer:
    - '%gcc@12.5.0'
  gmp:
    prefer:
    - '%gcc@12.5.0'
  automake:
    prefer:
    - '%gcc@12.5.0'
  m4:
    prefer:
    - '%gcc@12.5.0'
  libtool:
    prefer:
    - '%gcc@12.5.0'
  findutils:
    prefer:
    - '%gcc@12.5.0'
  mpc:
    prefer:
    - '%gcc@12.5.0'
  mpfr:
    prefer:
    - '%gcc@12.5.0'
  perl:
    prefer:
    - '%gcc@12.5.0'
  berkeley-db:
    prefer:
    - '%gcc@12.5.0'
  bzip2:
    prefer:
    - '%gcc@12.5.0'
  gdbm:
    prefer:
    - '%gcc@12.5.0'
  texinfo:
    prefer:
    - '%gcc@12.5.0'
  gettext:
    prefer:
    - '%gcc@12.5.0'
    - spec: +libxml2
      when: '%gcc@8:'
  ncurses:
    prefer:
    - '%gcc@12.5.0'
  zlib:
    prefer:
    - '%gcc@12.5.0'
  lz4:
    prefer:
    - '%gcc@12.5.0'
  xz:
    prefer:
    - '%gcc@12.5.0'
  libiconv:
    prefer:
    - '%gcc@12.5.0'
  nghttp2:
    prefer:
    - '%gcc@12.5.0'
  libibn2:
    prefer:
    - '%gcc@12.5.0'
  libssh2:
    prefer:
    - '%gcc@12.5.0'
  unzip:
    prefer:
    - '%gcc@12.5.0'
  libszip:
