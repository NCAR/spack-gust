# *** SLES Derecho Software Stack ***
spack:
  config:
    install_tree:
      projections:
        ^mpi: '{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}'
        all: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        gcc: '{name}/{version}/{hash:4}'
        netcdf-c: netcdf/{version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-c^mpi: netcdf/{version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
    build_jobs: 4
    test_stage: /glade/u/home/$user/temp/spack/gust/24.12/tests
    source_cache: /glade/u/home/$user/temp/spack/cache
    misc_cache: /glade/u/home/$user/temp/spack/gust/24.12/misc
    build_stage:
    - /glade/u/home/$user/temp/spack/gust/24.12/builds
    shared_linking:
    # Turning bind setting on would be beneficial but vendor compilers do not
    # seem to work with it! Avoid!
      type: rpath
      bind: false
    template_dirs:
    - /glade/u/apps/gust/24.12/envs/build/templates/modules
  packages:
    libcxi:
      externals:
      - spec: libcxi@main
        prefix: /usr
      buildable: false
      variants:
      - +cuda
    ncvis:
      require:
      - ^netcdf-c@:4.9.2
    openssl:
      externals:
      - spec: openssl@3.1.4
        prefix: /usr
      buildable: false
      require:
      - certs=system
      - '%gcc'
    pkgconfig:
      buildable: false
    lustre:
      externals:
      - spec: lustre@2.15.5.1_cray_1_gb2e0867
        prefix: /usr
      buildable: false
      require:
      - '%gcc'
    pkg-config:
      externals:
      - spec: pkg-config@0.29.2
        prefix: /usr
      buildable: false
      require:
      - '%gcc'
    gcc:
      externals:
      - spec: gcc@7.5.0 languages='c,c++'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
      - spec: gcc@12.3.0 languages='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-12
            cxx: /usr/bin/g++-12
            fortran: /usr/bin/gfortran-12
      - spec: gcc@13.2.1 languages='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-13
            cxx: /usr/bin/g++-13
            fortran: /usr/bin/gfortran-13
      variants:
      - +piclibs
      - languages=c,c++,fortran,go
      require:
      - '%gcc@7.5.0'
    adios2:
      variants:
      - +cuda
      - +hdf5
      - +python
    all:
      'compiler:':
      - gcc@12.4.0
      - gcc
      - oneapi
      - nvhpc
      - cce
      providers:
        'mpi:':
        - cray-mpich
        'szip:':
        - libszip
        'pkgconfig:':
        - pkg-config
        'lapack:':
        - openblas
        - intel-oneapi-mkl
        - cray-libsci
        - nvhpc
        'blas:':
        - openblas
        - intel-oneapi-mkl
        - cray-libsci
        - nvhpc
        'zlib-api:':
        - zlib
        'rpc:':
        - libtirpc
        tbb:
        - intel-oneapi-tbb
      permissions:
        read: world
        write: user
      target:
      # This target is lowest-common denominator between Intel and Milans
      - x86_64_v3
      prefer:
      # This should force packages to use the vendor-preferred solution
      # without needing to set it on each package UNLESS that package needs
      # to set its own preferences
      - spec: ^openblas
        when: '%gcc ^lapack'
      - spec: ^intel-oneapi-mkl
        when: '%oneapi ^lapack'
      - spec: ^nvhpc
        when: '%nvhpc ^lapack'
      - spec: ^cray-libsci
        when: '%cce ^lapack'
      - spec: ^openblas
        when: '%gcc ^blas'
      - spec: ^intel-oneapi-mkl
        when: '%oneapi ^blas'
      - spec: ^nvhpc
        when: '%nvhpc ^blas'
      - spec: ^cray-libsci
        when: '%cce ^blas'
      - spec: ^pkg-config
        when: ^pkgconfig
      - spec: ^zlib
        when: ^zlib-api
      - spec: cuda_arch=80 ^cuda@12.3.2
        when: ^cuda
      - spec: ^libfabric@1.22.0
        when: ^libfabric
      # Without these, these packages will use GCC versions
      # (not yet true for nvhpc/cce, but check when those runtimes are added)
      - spec: ^hdf5 %oneapi
        when: '%oneapi ^hdf5'
      - spec: ^netcdf-c %oneapi
        when: '%oneapi ^netcdf-c'
      # Try to motivate use of system libfabric for cray-mpich stuff
      - spec: ^libfabric@1.22.0
        when: ^libfabric ^cray-mpich@8.1.31
    antlr:
      require:
      - '%gcc'
    aocc:
