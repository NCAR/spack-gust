    cray-libsci:
      externals:
      - spec: cray-libsci@24.11.0
        modules:
        - cray-libsci/24.11.0
      buildable: false
    cray-mpich:
      externals:
      - spec: cray-mpich@8.1.31 %gcc
        prefix: /opt/cray/pe/mpich/8.1.31/ofi/gnu/12.3
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@8.1.31 %cce
        prefix: /opt/cray/pe/mpich/8.1.31/ofi/cray/17.0
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@8.1.31 %nvhpc
        prefix: /opt/cray/pe/mpich/8.1.31/ofi/nvidia/23.3
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@8.1.31 %oneapi
        prefix: /opt/cray/pe/mpich/8.1.31/ofi/intel/2022.1
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      buildable: false
